name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades em dependências (alta ou crítica bloqueiam)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npx ng build
# E2E (npm run e2e) roda contra o ambiente completo (Keycloak, API e banco); ver README.

  # Imagem só é publicada com o CI verde (ADR 0022 do back-end).
  imagem:
    needs: [frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/imagem.yml
