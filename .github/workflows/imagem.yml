name: Imagem

# Constrói, varre e publica a imagem do front no GHCR a cada push no main (e sob demanda). ADR 0022 do back-end.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/aurora-web
          tags: |
            type=sha,format=short
            type=raw,value=main
      - name: Construir (sem publicar) para a varredura
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: varredura/aurora-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Varredura de vulnerabilidades (Trivy; crítica corrigível bloqueia)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/saida"
          aquasec/trivy:0.67.2 image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1
          --db-repository mirror.gcr.io/aquasec/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          --format sarif --output /saida/trivy-aurora-web.sarif varredura/aurora-web:ci
      - name: Relatório da varredura na aba Security
        if: always() && hashFiles('trivy-*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-aurora-web.sarif
          category: trivy-aurora-web
      - name: Publicar com SBOM e proveniência
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
