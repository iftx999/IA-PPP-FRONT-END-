name: Imagem

# Constrói, varre e publica a imagem do front no GHCR a cada push no main (e sob demanda). ADR 0022 do back-end.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aurora-web
          tags: |
            type=sha,format=short
            type=raw,value=main
      - name: Construir (sem publicar) para a varredura
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: varredura/aurora-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Varredura de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: varredura/aurora-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-aurora-web.sarif
      - name: Relatório da varredura na aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-aurora-web.sarif
          category: trivy-aurora-web
      - name: Publicar com SBOM e proveniência
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
